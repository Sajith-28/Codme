user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Backend cluster definition
    upstream backend_servers {
        # Round-robin distribution across three FastAPI backend replica nodes
        server api_1:10000;
        server api_2:10000;
        server api_3:10000;
    }

    server {
        listen 80;
        server_name localhost;

        # Max body payload limit for user file operations
        client_max_body_size 50M;

        # Standard logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # Root redirection to the load-balanced api cluster
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # Core headers for upgrading execution stream to WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy client information headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Generous read/write timeouts to maintain stable stream connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
