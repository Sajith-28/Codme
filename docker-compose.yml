version: '3.8'

services:
  # Replica 1
  api_1:
    build:
      context: ./fastapi_backend
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=codme-super-secret-99
      - PORT=10000
    expose:
      - "10000"
    restart: always

  # Replica 2
  api_2:
    build:
      context: ./fastapi_backend
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=codme-super-secret-99
      - PORT=10000
    expose:
      - "10000"
    restart: always

  # Replica 3
  api_3:
    build:
      context: ./fastapi_backend
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=codme-super-secret-99
      - PORT=10000
    expose:
      - "10000"
    restart: always

  # Gateway Load Balancer
  loadbalancer:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_1
      - api_2
      - api_3
    restart: always
